name: Dynmap-EntityCountMap
version: '${project.version}'
main: com.github.kubota6646.dynmap.entitycountmap.EntityCountMapPlugin
api-version: '1.21'
description: Adds a colour-coded entity-count heat-map layer to Dynmap
authors:
  - kubota6646
website: https://github.com/kubota6646/Dynmap-EntityCountMap

# Dynmap must be loaded before this plugin starts
softdepend:
  - dynmap

commands:
  entitycountmap:
    description: Dynmap-EntityCountMap management commands
    usage: /entitycountmap <reload>
    aliases:
      - ecm

permissions:
  entitycountmap.reload:
    description: Allows reloading the Dynmap-EntityCountMap plugin
    default: op
