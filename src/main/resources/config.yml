# ============================================================
# Dynmap-EntityCountMap  –  デフォルト設定
# ============================================================

# マーカーを更新する間隔 (tick単位, 20 tick = 1秒)
# 小さい値ほどリアルタイムに近くなりますが、サーバー負荷が上がります
update-interval: 200

# この値以上のエンティティ数を「最大 (赤)」と見なします
# エンティティが少ないほど青/緑、多いほど黄→赤に変化します
max-entities: 50

# プレイヤーをエンティティ数に含めるか (true/false)
include-players: true

# アイテムドロップ (落ちているアイテム) をカウントに含めるか
include-item-drops: false

# チャンク矩形の塗りつぶし不透明度 (0.0 = 透明, 1.0 = 完全不透明)
fill-opacity: 0.45

# Dynmap レイヤーパネルでの表示優先度 (大きいほど上)
layer-priority: 10

# 対象ワールドのホワイトリスト
# 空のリスト (デフォルト) の場合は全ワールドが対象になります
# worlds:
#   - world
#   - world_nether
#   - world_the_end
worlds: []
